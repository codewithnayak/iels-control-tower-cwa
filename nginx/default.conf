server {
    listen 80;

    # Redirect root to /backoffice
    location / {
        return 302 /backoffice/;
    }

    # Serve the React app under /backoffice
    location /backoffice/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /backoffice/index.html;
    }

    # Optional health check
    location /health {
        return 200 "OK";
    }
}