server {
    listen 80;

    # Redirect root to /station
    location / {
        return 302 /station/;
    }

    # Serve the React app under /station
    location /station/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /station/index.html;
    }

    # Optional health check
    location /health {
        return 200 "OK";
    }
}